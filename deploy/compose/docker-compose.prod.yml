# OpenJM Enterprise AI — self-hosted production compose (VS8 Workstream A/B).
#
# A strong Compose deployment is preferred over Kubernetes (no K8s requirement).
# The backend is the only service that reaches the private model endpoint; the
# browser talks to the reverse proxy, which terminates TLS and serves the built
# frontend from the proxy image (Dockerfile.proxy).
#
#   # The database password is consumed from the Compose process environment only.
#   # Never write it to a world-readable file, never commit it, never paste it on
#   # the command line (that lands in shell history).
#   read -rs -p "OpenJM DB password: " OPENJM_DB_PASSWORD_SECRET; echo
#   export OPENJM_DB_PASSWORD_SECRET
#   docker compose -f deploy/compose/docker-compose.prod.yml up -d --build
#   unset OPENJM_DB_PASSWORD_SECRET   # Compose no longer needs it once the stack is up
#
# Secrets are never baked into an image and this file has no default passwords.
# The database password has a single source: the openjm_db_password secret, which
# both db and backend consume, so the two can never disagree. The backend
# entrypoint assembles OPENJM_DATABASE_URL from the mounted secret file, so the
# password is not duplicated into the application environment either.
#
# Why not a file-backed secret: Compose bind-mounts `file:` secrets, so the host
# file's owner and mode travel into the container unchanged. The backend runs
# unprivileged as `openjm` (uid 999) while an operator creates the file as their
# own account, so a restrictive 0600 host file is unreadable and the entrypoint
# fails with `cat: /run/secrets/openjm_db_password: Permission denied`. The only
# ways out of that are running the backend as root or loosening the secret to 0644
# on disk, both rejected. An environment-sourced secret is materialised by Compose
# itself, so no operator-owned file with a mismatched uid/mode exists at all.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openjm
      POSTGRES_DB: openjm
      POSTGRES_PASSWORD_FILE: /run/secrets/openjm_db_password
    volumes:
      - openjm-db:/var/lib/postgresql/data
    secrets:
      - openjm_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjm -d openjm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Single source of truth for the database password: the same secret the db
      # service reads. The entrypoint assembles OPENJM_DATABASE_URL from it, so
      # the DSN is never rendered with a stale or empty password.
      OPENJM_DB_PASSWORD_FILE: /run/secrets/openjm_db_password
      OPENJM_DB_HOST: db
      OPENJM_DB_PORT: "5432"
      OPENJM_DB_NAME: openjm
      OPENJM_DB_USER: openjm
    secrets:
      - openjm_db_password
    volumes:
      - openjm-data:/var/lib/openjm
      - openjm-keys:/etc/openjm
      - openjm-backups:/var/backups/openjm
    ports:
      - "127.0.0.1:8000:8000"
    # Liveness uses /api/health; readiness (which checks dependencies) is a
    # separate probe so a model-provider outage does not restart the container.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Caddy site address. Default is the production hostname (automatic TLS).
      # Override for a local/HTTP run, e.g. OPENJM_SITE_ADDRESS=":80".
      OPENJM_SITE_ADDRESS: ${OPENJM_SITE_ADDRESS:-openjm.example.com}
    ports:
      - "${OPENJM_HTTPS_PORT:-443}:443"
      - "${OPENJM_HTTP_PORT:-80}:80"
    volumes:
      - caddy-data:/data

volumes:
  openjm-db:
  openjm-data:
  openjm-keys:
  openjm-backups:
  caddy-data:

secrets:
  # Sourced from the Compose interpolation environment rather than a host file.
  # Compose consumes OPENJM_DB_PASSWORD_SECRET from the process environment it was
  # started with and materialises /run/secrets/openjm_db_password itself, so no
  # operator-owned file with a mismatched uid/mode exists and no chmod workaround
  # is needed. This variable belongs to the Compose invocation ONLY: it must never
  # be added to a service `environment:` or to the backend `env_file:`, so the
  # application process never sees it. Both db and backend read the mounted file.
  openjm_db_password:
    environment: OPENJM_DB_PASSWORD_SECRET
