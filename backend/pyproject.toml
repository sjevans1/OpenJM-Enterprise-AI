[project]
name = "openjm-enterprise-ai-backend"
version = "0.1.0"
description = "OpenJM Enterprise AI control plane and orchestration API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "dbgpt>=0.8.0rc1,<0.9",
  "dbgpt-ext[rag,storage_chromadb]>=0.8.0rc1,<0.9",
  "sentence-transformers>=3.0",
  "pandas==2.2.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
