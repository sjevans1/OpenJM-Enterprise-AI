[project]
name = "openjm-enterprise-ai-backend"
version = "0.2.0"
description = "OpenJM Enterprise AI control plane and orchestration API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.8",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "dbgpt>=0.8.0rc1,<0.9",
  "dbgpt-ext[rag,storage_chromadb]>=0.8.0rc1,<0.9",
  "sentence-transformers>=3.0",
  "pandas==2.2.3",
  "cryptography>=43.0",
  "sqlglot>=25.0",
  # BV5-B controlled PDF/DOCX rendering. reportlab builds the PDF, python-docx
  # builds the DOCX. No weasyprint, headless browser or pandoc is used.
  "reportlab>=4.0",
  "python-docx>=1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  # BV5-B test-only verifier: opens the rendered PDF to assert real magic bytes
  # and citation retention.
  "pypdf>=4.0",
  # Bundled PostgreSQL binaries so the PostgreSQL metadata-compatibility tests
  # run for real in CI instead of skipping.
  "pgserver>=0.1.4"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# A wheel (non-editable) deployment must migrate itself: app/migrations_runner.py
# resolves the Alembic script directory and alembic.ini relative to the installed
# package root (site-packages), so both are force-included at the wheel root.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"
"alembic.ini" = "alembic.ini"
