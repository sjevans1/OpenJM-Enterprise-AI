# Alembic configuration for OpenJM Enterprise AI application-metadata
# migrations. The URL is supplied at runtime by app.migrations_runner; the
# value here is a placeholder so `alembic` can be invoked from a shell.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Do not log full SQL/parameters by default: migration output can contain
# connection strings. Operators raise this temporarily when debugging.
sqlalchemy.url = sqlite:///./data/openjm.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
