name: OpenJM C3 policy-binding safety

# Manual runs only on the hardening branch. Continuous push/PR triggers
# were generating duplicate failure notifications during development.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-policy-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install "pytest>=8,<10" "pytest-asyncio>=0.23" "sqlalchemy[asyncio]>=2.0" "aiosqlite>=0.20" "pydantic>=2.8" "pydantic-settings>=2.4" "sqlglot>=25.0" "cryptography>=43.0" "httpx>=0.27"
      - name: Check Python source syntax
        run: python -m compileall -q app/services/dependent_hybrid.py app/api/data.py app/db.py app/models.py app/schemas.py tests/test_dependent_hybrid.py tests/test_dependent_currency.py tests/test_dependent_hybrid_orchestration.py app/services/orchestrator.py ../scripts/dependent_hybrid_acceptance.py
      - name: Acceptance harness command-line contract
        run: python ../scripts/dependent_hybrid_acceptance.py --help
      - name: Exercise C3 threshold and AST rejection gate
        run: python -m pytest -q tests/test_dependent_hybrid.py tests/test_dependent_currency.py
      - name: Exercise real dependent Hybrid orchestration with mocked tools
        run: python scripts/c3_currency_ci_orchestration.py

  frontend-citation-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test deterministic evidence label numbering
        run: node --test tests/evidenceLabels.test.mjs
      - name: Typecheck and production build
        run: npm run build
