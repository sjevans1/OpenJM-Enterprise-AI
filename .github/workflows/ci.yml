# OpenJM Enterprise AI: deterministic validation, no local Gemma or production secrets.
# Feature branches run via pull_request only (not also on push) to avoid duplicate jobs.
name: OpenJM CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Backend test tier to run on the selected Git ref"
        required: true
        type: choice
        default: full
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: openjm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: |
          python -m pip install --prefer-binary -e ".[dev]"
          python -m pip install "ruff>=0.9,<1"

      - name: Ruff critical correctness checks
        # Initial lint baseline: syntax, undefined names, and fatal Python issues.
        # Enforce broader formatting/import rules separately after fixing legacy debt.
        run: ruff check . --select E9,F63,F7,F82

      - name: Fast backend regression (pull requests)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'fast') }}
        run: python -m pytest -q --tb=short --maxfail=3 --ignore=tests/test_upload_source_name_integration.py

      - name: Full backend regression (main or explicitly dispatched)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') }}
        # The upload/source integration test runs a real isolated server and may
        # need a public embedding-model download. It never uses local Gemma.
        run: python -m pytest -q --tb=short --maxfail=3

      - name: Record validation tier
        if: success()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" = "fast" ]; }; then
            echo "Backend: fast deterministic tests (real embedding integration deferred)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Backend: full repository pytest suite, including isolated embedding integration." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Real Gemma/model acceptance remains a separate controlled local gate." >> "$GITHUB_STEP_SUMMARY"

  rel1_lock_drift_gate:
    name: REL1 / lock drift gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Stable release gate: the committed locks are authoritative, so verify on
    # every event CI already runs on (pull_request, push to main, dispatch).
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile hash-pinned locks from the pinned resolver toolchain
        # Seed pip-compile with the committed locks so unchanged dependency
        # ranges do not drift merely because a newer transitive release appears
        # on the package index. pip-compile reuses compatible existing pins and
        # updates them only when pyproject.toml actually requires a change.
        run: |
          mkdir -p "$RUNNER_TEMP/openjm-locks"
          cp backend/requirements.lock "$RUNNER_TEMP/openjm-locks/requirements.lock"
          cp backend/requirements-dev.lock "$RUNNER_TEMP/openjm-locks/requirements-dev.lock"
          bash scripts/compile-python-locks.sh "$RUNNER_TEMP/openjm-locks"

      - name: Fail on drift between regenerated and committed locks
        # Byte-compares the regenerated locks against backend/requirements.lock
        # and backend/requirements-dev.lock. Catches both a changed
        # pyproject.toml without refreshed locks and resolver/toolchain changes
        # that alter resolution.
        run: bash scripts/check-python-lock-drift.sh "$RUNNER_TEMP/openjm-locks" backend

      - name: Build binary-only production wheelhouse from the committed lock
        # Proves the committed production lock can populate an offline,
        # hash-pinned, binary-only wheelhouse for the supported Linux target.
        run: |
          mkdir -p "$RUNNER_TEMP/openjm-wheelhouse"
          bash scripts/build-python-wheelhouse.sh \
            "$RUNNER_TEMP/openjm-wheelhouse" backend/requirements.lock

  rel1_offline_bundle_gate:
    name: REL1 / offline bundle + registry-blocked acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install --prefer-binary -e ".[dev]"

      - name: Validate release-tooling scripts
        run: |
          for script in \
            scripts/build-rel1-bundle.sh \
            scripts/build-npm-offline-cache.sh \
            scripts/stage-release-payload.sh \
            scripts/rel1-offline-acceptance.sh \
            scripts/build-python-wheelhouse.sh; do
            bash -n "$script"
          done
          python -m json.tool frontend/package-lock.json >/dev/null

      - name: REL1-B bundle determinism and exclusion tests
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_rel1b_bundle_assembly.py \
            tests/test_rel1b_release_integrity.py \
            tests/test_rel1b_release_locks.py

      - name: Assemble a bundle from a pinned lock
        # CI smoke: assembly of the real layout (payload + lock + wheelhouse +
        # npm cache + manifest) with a small, fast, hash-pinned lock so the
        # registry-blocked acceptance below stays bounded. The committed
        # production lock's wheelhouse is proven by the drift gate; the final
        # full-lock install on a real host is REL1-B4.
        run: |
          set -euo pipefail
          SMOKE_LOCK="$RUNNER_TEMP/smoke-requirements.lock"
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/smoke" six==1.16.0
          SIX_HASH="$(sha256sum "$RUNNER_TEMP"/smoke/six-*.whl | awk '{print $1}')"
          printf 'six==1.16.0 \\\n    --hash=sha256:%s\n' "$SIX_HASH" > "$SMOKE_LOCK"
          bash scripts/build-rel1-bundle.sh --lock "$SMOKE_LOCK" "$RUNNER_TEMP/bundle"

      - name: Registry-blocked acceptance (python --no-index + npm --offline)
        # Proves the assembled bundle installs/builds with public registries
        # refused: pip --no-index --find-links wheelhouse --require-hashes, and
        # npm ci --offline against npm/cache pointing at a dead registry. This is
        # the CI-level proof; REL1-B4 runs the same script on a real host.
        run: |
          bash scripts/rel1-offline-acceptance.sh \
            "$RUNNER_TEMP/bundle/openjm-rel1-0.2.0"

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        run: npm test -- --run

      - name: TypeScript check and production build
        run: npm run build

      - name: Record frontend validation
        if: success()
        run: |
          echo "Frontend: Vitest and TypeScript/Vite production build passed." >> "$GITHUB_STEP_SUMMARY"
